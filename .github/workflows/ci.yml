# Build y tests en cada PR y en cada push a main.
# Para que un PR no se pueda fusionar en rojo, marcar «Backend» y «Frontend» como checks obligatorios
# en la protección de main (ver docs/despliegue.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Python para verificar el resguardo V9
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # Unitarios e integraciones con PostgreSQL descartable de Testcontainers.
      # El ensayo real de dump/restauración no debe omitirse en CI.
      - name: Verificar backend y resguardo
        env:
          VASTIO_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          test -x "$VASTIO_TEST_PYTHON"
          "$VASTIO_TEST_PYTHON" --version
          ./mvnw -B verify
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b + vite build
      - run: npm run build
