# Build y tests en cada PR y en cada push a main.
# Para que un PR no se pueda fusionar en rojo, marcar «Backend» y «Frontend» como checks obligatorios
# en la protección de main (ver docs/despliegue.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unitarios y de integración (Testcontainers usa el Docker del runner).
      - run: ./mvnw -B verify
      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-backend
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc -b + vite build
      - run: npm run build
