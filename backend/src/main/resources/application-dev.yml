# Perfil de desarrollo: base de docker-compose.yml (docker compose up -d db).
# Lee el .env de la raíz del repo si existe (ver .env.example).
spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vastio}
    username: ${DB_USER:vastio}
    password: ${DB_PASSWORD:vastio}

vastio:
  seguridad:
    jwt-secreto: ${VASTIO_JWT_SECRETO:solo-para-desarrollo-local-no-usar-en-otro-lado}
  usuario-inicial:
    usuario: ${VASTIO_ADMIN_USUARIO:direccion}
    contrasena: ${VASTIO_ADMIN_CONTRASENA:}
  demo:
    contrasena: ${VASTIO_DEMO_CONTRASENA:}
    # Además de los datos de demostración, EscenarioCompleto: historia (eventos cerrados con consumo), egresados, órdenes
    # en todos los estados y stock, para mostrar todo el circuito. Con VASTIO_DEMO_COMPLETO=false, solo los datos básicos.
    completo: ${VASTIO_DEMO_COMPLETO:true}

springdoc:
  api-docs:
    enabled: true
    path: /api/docs/openapi.json
  swagger-ui:
    enabled: true
    path: /api/docs
