spring:
  application:
    name: vastio
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Contrato digitalizado: hasta 10 archivos de 10 MB (ContratoService).
      max-file-size: 10MB
      max-request-size: 101MB
  jackson:
    deserialization:
      # Jackson 3 rechaza un booleano o número ausente; en los pedidos, ausente es false o 0.
      fail-on-null-for-primitives: false

vastio:
  seguridad:
    # Obligatoria fuera de dev: al menos 32 caracteres al azar.
    jwt-secreto: ${VASTIO_JWT_SECRETO:}
    minutos-acceso: 15
    cookie-segura: true
  legajo:
    # Archivos del legajo (contratos). En el ambiente de prueba, un volumen de Docker (docs/despliegue.md).
    directorio: ${VASTIO_LEGAJO_DIRECTORIO:datos/legajo}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Detrás de Caddy: respeta X-Forwarded-Proto y X-Forwarded-For.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
