spring:
  application:
    name: vastio
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway; Hibernate solo verifica que las entidades coincidan.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

vastio:
  seguridad:
    # Obligatoria fuera de dev: al menos 32 caracteres al azar.
    jwt-secreto: ${VASTIO_JWT_SECRETO:}
    minutos-acceso: 15
    cookie-segura: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
