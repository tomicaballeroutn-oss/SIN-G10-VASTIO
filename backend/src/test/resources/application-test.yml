vastio:
  calendar:
    seguimiento-programado: false
  seguridad:
    jwt-secreto: secreto-de-tests-con-al-menos-32-caracteres
    # MockMvc no usa HTTPS; la cookie igual se verifica en los tests.
    cookie-segura: false
  legajo:
    directorio: ${java.io.tmpdir}/vastio-legajo-test
  realizacion:
    # Los tests llaman a RealizacionService con un reloj fijo; el proceso programado movería sus eventos.
    automatica: false
