<!-- @dsCard group="Datos" height=220 subtitle="Cambiá de vista sin salir de la pantalla" -->
<style>
html,body{margin:0}
body{padding:20px;background:var(--canvas);color:var(--ink);font:400 16px/24px var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.col{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.cap{margin:0 0 8px;color:var(--ink-muted)}
.w-sm{max-width:360px}.w-md{max-width:560px}
</style>

<div id="root"></div>
<script>
const V=window.Vastio,$=React.createElement,{useState}=React;
const cap=(t)=>$("p",{className:"overline cap"},t);

function App(){return $('div',{className:'col'},
 $('div',null,cap('Subrayado: vistas de la agenda'),$(V.Tabs,{label:'Vista de agenda',items:[{id:'m',label:'Mensual',icon:'calendar-days'},{id:'s',label:'Semanal'},{id:'d',label:'Diaria'}]})),
 $('div',null,cap('Segmentado con contador'),$(V.Tabs,{variant:'segmented',label:'Estado',defaultValue:'todos',items:[{id:'todos',label:'Todos',count:24},{id:'pre',label:'Pre-reservas',count:5},{id:'sen',label:'Señados',count:9}]}))
);}
ReactDOM.createRoot(document.getElementById("root")).render($(App));
</script>
