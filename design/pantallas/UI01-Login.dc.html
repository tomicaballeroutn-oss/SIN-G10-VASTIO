<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vastio · Inicio de sesión</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/vastio/tokens.css"><link rel="stylesheet" href="ds/vastio/components/bundle.css"><script src="ds/vastio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#e6e2dd;color:#021226;}

.display{font:500 56px/60px 'Jost',sans-serif;letter-spacing:-0.01em;margin:0}
.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}
h1{font:600 32px/40px 'Poppins',sans-serif;letter-spacing:-0.01em;margin:0}
h2{font:600 24px/32px 'Poppins',sans-serif;letter-spacing:-0.005em;margin:0}
h3{font:600 20px/28px 'Poppins',sans-serif;margin:0}
h4{font:600 16px/24px 'Poppins',sans-serif;margin:0}
.body-lg{font:400 18px/28px 'Poppins',sans-serif}
.body-sm{font:400 14px/20px 'Poppins',sans-serif}
.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}
.numeral-sm{font:500 15px/20px 'Jost',sans-serif;font-variant-numeric:tabular-nums}


</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#e6e2dd;color:#021226;overflow:hidden;">

<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
  <div style="width:420px;display:flex;flex-direction:column;align-items:center;gap:28px;">
    <img src="/_blob/63e9f3ef64998202f1a487799a0e2ab7" alt="Vastio" style="width:220px;height:auto;">
    <div style="text-align:center;">
      <div class="display-sm">Ingresá a tu cuenta</div>
      <div class="body-lg" style="color:#404b5a;margin-top:8px;">El sistema del complejo Avril · Club de Campo · Santa Bárbara</div>
    </div>
    <div style="width:100%;display:flex;flex-direction:column;gap:16px;">
      <x-import component-from-global-scope="Vastio.Input" label="Usuario" placeholder="nombre.apellido" size="lg" default-value="lucia.ferreyra"></x-import>
      <x-import component-from-global-scope="Vastio.Input" label="Contraseña" type="password" placeholder="••••••••" size="lg"></x-import>
      <sc-if value="{{showError}}" hint-placeholder-val="{{true}}">
        <x-import component-from-global-scope="Vastio.Alert" tone="danger" title="Usuario o contraseña incorrectos">Volvé a intentarlo.</x-import>
      </sc-if>
      <x-import component-from-global-scope="Vastio.Button" variant="solid" tone="brand" size="lg" block="{{true}}">Ingresar</x-import>
    </div>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { showError: this.props.showError ?? false }; }
}
</script>
</body>
</html>
