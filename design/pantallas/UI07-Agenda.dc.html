<style>

.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}

.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}

<div style="width:1280px;height:840px;box-sizing:border-box;background:#e6e2dd;color:#021226;overflow:hidden;">

<div style="display:flex;height:100%;">

    <div style="display:flex;align-items:center;gap:10px;padding:0 8px;"><img src="/_blob/0b4fc5affd13f9515bc6c46761452e90" style="width:28px;"><span class="overline" style="color:#153e6c;">Vastio</span></div>
    <x-import component-from-global-scope="Vastio.Nav" layout="sidebar" items="{{navItems}}" value="agenda" label="Navegación principal"></x-import>
  </div>
  <div style="flex-grow:1;padding:32px 40px;display:flex;flex-direction:column;gap:20px;overflow:auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <h1>Agenda</h1>
      <x-import component-from-global-scope="Vastio.Tabs" variant="segmented" items="{{vistaItems}}" value="mes" label="Vista"></x-import>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <x-import component-from-global-scope="Vastio.Button" variant="outline" tone="brand" size="sm">Hoy</x-import>
      <x-import component-from-global-scope="Vastio.Select" placeholder="Todos los salones" options="{{salonOptions}}" style="width:200px;"></x-import>
      <x-import component-from-global-scope="Vastio.Select" placeholder="Todos los estados" options="{{estadoOptions}}" style="width:200px;"></x-import>
      <x-import component-from-global-scope="Vastio.Select" placeholder="Todas las planners" options="{{plannerOptions}}" style="width:200px;"></x-import>
    </div>
    <x-import component-from-global-scope="Vastio.AgendaGrid" year="2026" month="9" events="{{events}}" today="2026-09-26" legend="{{yes}}"></x-import>
  </div>
</div>

</div>
