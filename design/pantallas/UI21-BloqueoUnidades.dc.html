<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vastio · Bloqueo de unidades</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/vastio/tokens.css"><link rel="stylesheet" href="ds/vastio/components/bundle.css"><script src="ds/vastio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#e6e2dd;color:#021226;}

.display{font:500 56px/60px 'Jost',sans-serif;letter-spacing:-0.01em;margin:0}
.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}
h1{font:600 32px/40px 'Poppins',sans-serif;letter-spacing:-0.01em;margin:0}
h2{font:600 24px/32px 'Poppins',sans-serif;letter-spacing:-0.005em;margin:0}
h3{font:600 20px/28px 'Poppins',sans-serif;margin:0}
h4{font:600 16px/24px 'Poppins',sans-serif;margin:0}
.body-lg{font:400 18px/28px 'Poppins',sans-serif}
.body-sm{font:400 14px/20px 'Poppins',sans-serif}
.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}
.numeral-sm{font:500 15px/20px 'Jost',sans-serif;font-variant-numeric:tabular-nums}


</style>
</helmet>
<div style="width:1280px;height:800px;box-sizing:border-box;background:#e6e2dd;color:#021226;overflow:hidden;">

<div style="display:flex;height:100%;">
  <div style="width:200px;flex:none;background:#ffffff;border-right:1px solid #d6d1cb;padding:20px 12px;display:flex;flex-direction:column;gap:24px;">
    <div style="display:flex;align-items:center;gap:10px;padding:0 8px;"><img src="/_blob/0b4fc5affd13f9515bc6c46761452e90" style="width:28px;"><span class="overline" style="color:#153e6c;">Vastio</span></div>
    <x-import component-from-global-scope="Vastio.Nav" layout="sidebar" items="{{navItems}}" value="agenda" label="Navegación principal"></x-import>
  </div>
  <div style="flex-grow:1;padding:32px 40px;display:flex;gap:32px;overflow:auto;">
    <div style="flex:1.3;display:flex;flex-direction:column;gap:16px;">
      <h1>Bloqueo de unidades</h1>
      <x-import component-from-global-scope="Vastio.Table" columns="{{cols}}" rows="{{rows}}"></x-import>
    </div>
    <div style="width:380px;flex:none;background:#ffffff;border:1px solid #d6d1cb;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;">
      <h4>Nuevo bloqueo</h4>
      <x-import component-from-global-scope="Vastio.Select" label="Salones" placeholder="Elegí uno o más" options="{{salonOptions}}"></x-import>
      <x-import component-from-global-scope="Vastio.Input" label="Desde" type="date"></x-import>
      <x-import component-from-global-scope="Vastio.Input" label="Hasta" type="date"></x-import>
      <x-import component-from-global-scope="Vastio.Select" label="Turnos" placeholder="Mediodía, noche o ambos" options="{{turnoOptions}}"></x-import>
      <x-import component-from-global-scope="Vastio.Select" label="Motivo" placeholder="Elegí un motivo" options="{{motivoOptions}}"></x-import>
      <x-import component-from-global-scope="Vastio.Button" variant="solid" tone="brand">Registrar bloqueo</x-import>
      <div class="body-sm" style="color:#404b5a;">En la agenda, un bloqueo se ve rayado con el ícono de candado. Desbloquear pide confirmación.</div>
    </div>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      navItems: [{"id":"inicio","label":"Inicio","icon":"home"},{"id":"agenda","label":"Agenda","icon":"calendar"},{"id":"usuarios","label":"Usuarios","icon":"users"},{"id":"bebidas","label":"Bebidas","icon":"wine"},{"id":"parametros","label":"Parámetros","icon":"settings"}],
      salonOptions: [{value:'avril',label:'Avril'},{value:'club',label:'Club de Campo'},{value:'santa-barbara',label:'Santa Bárbara'}],
      turnoOptions: [{value:'mediodia',label:'Mediodía'},{value:'noche',label:'Noche'},{value:'ambos',label:'Ambos'}],
      motivoOptions: [{value:'mantenimiento',label:'Mantenimiento'},{value:'feriado',label:'Feriado'},{value:'propio',label:'Evento propio'}],
      cols: [
        { key: 'salon', header: 'Salón' }, { key: 'rango', header: 'Rango de fechas' }, { key: 'turnos', header: 'Turnos' }, { key: 'motivo', header: 'Motivo' },
      ],
      rows: [
        { id: 1, salon: 'Club de Campo', rango: '01/07 – 05/07', turnos: 'Ambos', motivo: 'Mantenimiento' },
        { id: 2, salon: 'Santa Bárbara', rango: '25/12', turnos: 'Noche', motivo: 'Feriado' },
      ],
    };
  }
}
</script>
</body>
</html>
