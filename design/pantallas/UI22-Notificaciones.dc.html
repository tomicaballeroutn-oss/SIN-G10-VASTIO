<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vastio · Notificaciones</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/vastio/tokens.css"><link rel="stylesheet" href="ds/vastio/components/bundle.css"><script src="ds/vastio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#e6e2dd;color:#021226;}

.display{font:500 56px/60px 'Jost',sans-serif;letter-spacing:-0.01em;margin:0}
.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}
h1{font:600 32px/40px 'Poppins',sans-serif;letter-spacing:-0.01em;margin:0}
h2{font:600 24px/32px 'Poppins',sans-serif;letter-spacing:-0.005em;margin:0}
h3{font:600 20px/28px 'Poppins',sans-serif;margin:0}
h4{font:600 16px/24px 'Poppins',sans-serif;margin:0}
.body-lg{font:400 18px/28px 'Poppins',sans-serif}
.body-sm{font:400 14px/20px 'Poppins',sans-serif}
.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}
.numeral-sm{font:500 15px/20px 'Jost',sans-serif;font-variant-numeric:tabular-nums}


</style>
</helmet>
<div style="width:480px;height:760px;box-sizing:border-box;background:#e6e2dd;color:#021226;overflow:hidden;">

<div style="height:100%;box-sizing:border-box;background:#ffffff;border:1px solid #d6d1cb;border-radius:16px;box-shadow:0 8px 24px rgba(2,18,38,.14);display:flex;flex-direction:column;overflow:hidden;">
  <div style="padding:20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d6d1cb;">
    <h3 style="margin:0;">Notificaciones</h3>
    <x-import component-from-global-scope="Vastio.Badge" tone="accent">3 nuevas</x-import>
  </div>
  <div style="padding:12px 20px;display:flex;gap:8px;border-bottom:1px solid #d6d1cb;">
    <x-import component-from-global-scope="Vastio.Tabs" variant="segmented" items="{{filtroItems}}" value="sin-leer" label="Filtro"></x-import>
  </div>
  <div style="flex-grow:1;overflow:auto;">
    <div style="padding:14px 20px;border-bottom:1px solid #d6d1cb;display:flex;gap:10px;"><x-import component-from-global-scope="Vastio.Icon" name="calendar-plus" size="18"></x-import><div style="flex-grow:1;"><div class="body-sm">Nueva pre-reserva en Santa Bárbara</div><div class="caption" style="color:#404b5a;">hoy 14:32</div></div></div>
    <div style="padding:14px 20px;border-bottom:1px solid #d6d1cb;display:flex;gap:10px;"><x-import component-from-global-scope="Vastio.Icon" name="banknote" size="18"></x-import><div style="flex-grow:1;"><div class="body-sm">Seña registrada · Delfina Ríos</div><div class="caption" style="color:#404b5a;">hoy 11:05</div></div></div>
    <div style="padding:14px 20px;display:flex;gap:10px;"><x-import component-from-global-scope="Vastio.Icon" name="calendar-x" size="18"></x-import><div style="flex-grow:1;"><div class="body-sm">Evento reprogramado · Bruno &amp; Martina</div><div class="caption" style="color:#404b5a;">ayer 18:20</div></div></div>
  </div>
  <div style="padding:12px 20px;border-top:1px solid #d6d1cb;">
    <x-import component-from-global-scope="Vastio.Button" variant="text" tone="brand">Marcar todas como leídas</x-import>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return { filtroItems: [{ id: 'sin-leer', label: 'Sin leer' }, { id: 'todas', label: 'Todas' }] }; }
}
</script>
</body>
</html>
