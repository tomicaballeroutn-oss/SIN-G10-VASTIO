<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vastio · Lector de código</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/vastio/tokens.css"><link rel="stylesheet" href="ds/vastio/components/bundle.css"><script src="ds/vastio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#021226;color:#f5f2ee;}

.display{font:500 56px/60px 'Jost',sans-serif;letter-spacing:-0.01em;margin:0}
.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}
h1{font:600 32px/40px 'Poppins',sans-serif;letter-spacing:-0.01em;margin:0}
h2{font:600 24px/32px 'Poppins',sans-serif;letter-spacing:-0.005em;margin:0}
h3{font:600 20px/28px 'Poppins',sans-serif;margin:0}
h4{font:600 16px/24px 'Poppins',sans-serif;margin:0}
.body-lg{font:400 18px/28px 'Poppins',sans-serif}
.body-sm{font:400 14px/20px 'Poppins',sans-serif}
.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}
.numeral-sm{font:500 15px/20px 'Jost',sans-serif;font-variant-numeric:tabular-nums}


</style>
</helmet>
<div data-theme="dark" style="width:390px;height:760px;box-sizing:border-box;background:#021226;color:#f5f2ee;overflow:hidden;">

<div style="height:100%;box-sizing:border-box;position:relative;background:#000;display:flex;flex-direction:column;">
  <div style="flex-grow:1;position:relative;display:flex;align-items:center;justify-content:center;">
    <div style="width:78%;aspect-ratio:1;border:3px solid #e2b254;border-radius:20px;"></div>
    <div style="position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;">
      <x-import component-from-global-scope="Vastio.IconButton" icon="x" label="Cerrar" variant="text"></x-import>
      <div class="body-sm" style="color:#fff;">Apuntá al código de la caja</div>
      <div style="width:24px;"></div>
    </div>
  </div>
  <div style="background:#0d2e54;padding:20px;display:flex;flex-direction:column;gap:12px;">
    <div style="display:flex;align-items:center;gap:12px;background:#0a1526;border-radius:12px;padding:12px 16px;">
      <x-import component-from-global-scope="Vastio.Icon" name="check-circle-2" size="22" style="color:#5ecfc3;"></x-import>
      <div style="flex-grow:1;">
        <div class="body">Fernet Branca</div>
        <div class="caption" style="color:#afb8c4;">Cajón x12 escaneado</div>
      </div>
      <span class="numeral">1 caja</span>
    </div>
    <x-import component-from-global-scope="Vastio.Button" variant="outline" tone="brand" size="lg" block="{{yes}}">Elegir a mano</x-import>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":760}}'>
class Component extends DCLogic { renderVals() { return { yes: true }; } }
</script>
</body>
</html>
