<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vastio · Cierre de evento</title>
<script src="./support.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="ds/vastio/tokens.css"><link rel="stylesheet" href="ds/vastio/components/bundle.css"><script src="ds/vastio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Poppins',sans-serif;background:#021226;color:#f5f2ee;}

.display{font:500 56px/60px 'Jost',sans-serif;letter-spacing:-0.01em;margin:0}
.display-sm{font:500 40px/44px 'Jost',sans-serif;letter-spacing:-0.005em;margin:0}
.overline{font:500 12px/16px 'Jost',sans-serif;letter-spacing:0.28em;text-transform:uppercase;margin:0}
h1{font:600 32px/40px 'Poppins',sans-serif;letter-spacing:-0.01em;margin:0}
h2{font:600 24px/32px 'Poppins',sans-serif;letter-spacing:-0.005em;margin:0}
h3{font:600 20px/28px 'Poppins',sans-serif;margin:0}
h4{font:600 16px/24px 'Poppins',sans-serif;margin:0}
.body-lg{font:400 18px/28px 'Poppins',sans-serif}
.body-sm{font:400 14px/20px 'Poppins',sans-serif}
.label{font:500 14px/20px 'Poppins',sans-serif}
.caption{font:500 12px/16px 'Poppins',sans-serif}
.stat-num{font:500 40px/44px 'Jost',sans-serif;font-variant-numeric:tabular-nums;margin:0}
.numeral{font:500 18px/24px 'Jost',sans-serif;font-variant-numeric:tabular-nums}
.numeral-sm{font:500 15px/20px 'Jost',sans-serif;font-variant-numeric:tabular-nums}


</style>
</helmet>
<div data-theme="dark" style="width:390px;height:844px;box-sizing:border-box;background:#021226;color:#f5f2ee;overflow:hidden;">

<div style="height:100%;box-sizing:border-box;display:flex;flex-direction:column;">
  <div style="padding:20px;background:#0d2e54;border-bottom:1px solid #0d2e54;">
    <h3 style="margin:0;">Cerrar evento</h3>
    <div class="body-sm" style="color:#afb8c4;">Bruno &amp; Martina · Avril</div>
  </div>
  <div style="flex-grow:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;">
    <x-import component-from-global-scope="Vastio.Table" columns="{{cols}}" rows="{{rows}}"></x-import>
    <div class="body" style="margin-top:8px;">Total valorizado: <span class="numeral">$186.000</span></div>
    <div class="body-sm" style="color:#afb8c4;">"No editable · se corrige con un ajuste" una vez cerrado.</div>
  </div>
  <div style="padding:16px 20px;background:#0d2e54;border-top:1px solid #0d2e54;">
    <x-import component-from-global-scope="Vastio.Button" variant="solid" tone="brand" size="lg" block="{{yes}}">Cerrar evento</x-import>
  </div>
  <div style="height:64px;flex:none;background:#0d2e54;border-top:1px solid #0d2e54;">
    <x-import component-from-global-scope="Vastio.Nav" layout="bottom" items="{{navItems}}" value="hoy" label="Navegación"></x-import>
  </div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, navItems: [{"id":"hoy","label":"Hoy","icon":"martini"},{"id":"stock","label":"Stock","icon":"package"},{"id":"movs","label":"Movimientos","icon":"history"}],
      cols: [
        { key: 'bebida', header: 'Bebida' }, { key: 'entregado', header: 'Entregado', numeric: true },
        { key: 'devuelto', header: 'Devuelto', numeric: true }, { key: 'consumo', header: 'Consumo real', numeric: true },
      ],
      rows: [
        { id: 1, bebida: 'Fernet Branca', entregado: '6', devuelto: '2', consumo: '4' },
        { id: 2, bebida: 'Vino tinto malbec', entregado: '8', devuelto: '2', consumo: '6' },
      ],
    };
  }
}
</script>
</body>
</html>
